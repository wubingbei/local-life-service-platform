<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>本地生活</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css?v=20260603">
  <link href="./css/main.css?v=20260603" rel="stylesheet">
  <link href="./css/login.css?v=20260603" rel="stylesheet">

  <style type="text/css">
  </style>
</head>
<body>
<div id="app">
  <div class="login-container">
    <div class="header">
      <div class="header-back-btn" @click="goBack" ><i class="el-icon-arrow-left"></i></div>
      <div class="header-title">手机号码快捷登录</div>
      <div class="header-placeholder"></div>
    </div>
    <div class="content">
      <div class="login-form">
        <div style="display: flex; justify-content: space-between">
          <el-input style="width: 60%" placeholder="请输入手机号" v-model="form.phone"></el-input>
          <el-button style="width: 38%" @click="sendCode" type="success" :disabled="disabled">{{codeBtnMsg}}</el-button>
        </div>

        <div style="height: 5px"></div>
        <el-input placeholder="请输入验证码" v-model="form.code"></el-input>
        <div style="text-align: center; color: #8c939d;margin: 5px 0">未注册的手机号码验证后自动创建账户</div>
        <el-button @click="login" style="width: 100%; background-color:#FF2442; color: #fff;">登录</el-button>
        <div style="text-align: center; margin-top: 15px;">
          <a href="index.html" style="color: #999; font-size: 13px;">先逛逛，暂不登录</a>
        </div>
        <div style="text-align: right; color:#333333; margin: 5px 0"><a href="login2.html">密码登录</a></div>
      </div>
      <div class="login-radio">
        <div>
          <input type="radio" id="readed" name="readed" v-model="radio" value="1">
          <label for="readed"></label>
        </div>
        <div>我已阅读并同意
          <a href="javascript:void(0)">
          《本地生活用户服务协议》</a>、
          <a href="javascript:void(0)">《隐私政策》</a>
          等，接受免除或者限制责任、诉讼管辖约定等粗体标示条款
        </div>
      </div>
    </div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      radio: "",
      disabled: false, // 发送短信按钮
      codeBtnMsg: "发送验证码", // 发送短信按钮提示
      form:{
        phone: '',
        code: ''
      }
    },
    methods: {
      // 弹窗提示错误
      showError(msg) {
        this.$message.error(msg);
      },
      login(){
        if(!this.radio){
          this.showError("请先确认阅读用户协议！");
          return
        }
        if(!this.form.phone){
          this.showError("手机号不能为空！");
          return
        }
        if(!/^1[3-9]\d{9}$/.test(this.form.phone)){
          this.showError("手机号格式错误！");
          return
        }
        if(!this.form.code){
          this.showError("验证码不能为空！");
          return
        }
        axios.post("user/login", this.form)
        .then(({data}) => {
            if(data){
              // 保存用户信息到session
              sessionStorage.setItem("token", data);
            }
            // 跳转回原页面，没有则跳首页（replace 替换历史记录，避免后退回到登录页）
            var redirect = util.getUrlParam("redirect");
            location.replace(redirect || "/index.html");
        })
        .catch(err => this.showError(err))
      },
      goBack(){
        location.href="index.html";
      },
      sendCode(){
        if (!this.form.phone) {
          this.showError("手机号不能为空");
          return;
        }
        // 前端校验手机号格式
        if (!/^1[3-9]\d{9}$/.test(this.form.phone)) {
          this.showError("手机号格式错误！");
          return;
        }
        // 发送验证码
        axios.post("user/code?phone="+this.form.phone)
          .then(({data}) => {
            // 后端返回验证码，自动填入输入框
            if (data) {
              this.form.code = data;
              this.$message.success("验证码已自动填入：" + data);
            } else {
              this.$message.success("验证码已发送，请查看手机短信");
            }
          })
          .catch(err => {
            console.log(err);
            this.showError(err)
          });
        // 禁用按钮
        this.disabled = true;
        // 按钮倒计时
        let i = 60;
        this.codeBtnMsg = (i--) + '秒后可重发'
        let taskId = setInterval(() => this.codeBtnMsg = (i--) + '秒后可重发', 1000);
        setTimeout(() => {
          this.disabled = false;
          clearInterval(taskId);
          this.codeBtnMsg = "发送验证码";
        }, 59000)
      }
    }
  })
</script>
</body>
</html>
