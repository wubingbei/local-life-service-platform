server:
  port: 8081
spring:
  application:
    name: llsp
  ai:
    openai:
      api-key: your-ai-api-key
      base-url: your-ai-base-url
      chat:
        options:
          model: your-ai-model-name
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/llsp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: your-mysql-password
  data:
    redis:
      host: your-redis-host
      port: 6379
      password: your-redis-password
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  redisson:
    address: redis://your-redis-host:6379
    password: your-redis-password
  jackson:
    default-property-inclusion: non_null
  rabbitmq:
    host: your-rabbitmq-host
    port: 5672
    virtual-host: /your-vhost
    username: your-rabbitmq-username
    password: your-rabbitmq-password
mybatis-plus:
  type-aliases-package: com.llsp.entity
logging:
  level:
    com.llsp: debug
