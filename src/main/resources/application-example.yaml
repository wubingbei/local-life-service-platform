# ============================================================
# 本地生活服务平台 - 配置模板
# 使用方法：复制此文件为 application.yaml，修改对应的值
#
# 环境变量列表（生产环境通过环境变量注入，优先级高于此文件）：
#   SERVER_PORT       - 服务端口，默认 8081
#   MYSQL_HOST        - MySQL 地址，默认 localhost
#   MYSQL_PORT        - MySQL 端口，默认 3306
#   MYSQL_DB          - 数据库名，默认 llsp
#   MYSQL_USER        - MySQL 用户名，默认 root
#   MYSQL_PASSWORD    - MySQL 密码
#   REDIS_HOST        - Redis 地址，默认 localhost
#   REDIS_PORT        - Redis 端口，默认 6379
#   REDIS_PASSWORD    - Redis 密码
#   RABBITMQ_HOST     - RabbitMQ 地址，默认 localhost
#   RABBITMQ_PORT     - RabbitMQ 端口，默认 5672
#   RABBITMQ_VHOST    - RabbitMQ 虚拟主机，默认 /
#   RABBITMQ_USER     - RabbitMQ 用户名，默认 guest
#   RABBITMQ_PASSWORD - RabbitMQ 密码，默认 guest
#   QWEN_API_KEY      - 通义千问 API Key（必填）
#   AI_BASE_URL       - AI API 地址，默认阿里云 DashScope
#   AI_MODEL          - AI 模型名，默认 qwen-plus-2025-07-28
#   UPLOAD_DIR        - 图片上传目录，默认 ./uploads/imgs
#   --- 付费方案（不配也能跑）---
#   OSS_ENDPOINT / OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET / OSS_BUCKET_NAME
# ============================================================

server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: llsp
  ai:
    openai:
      api-key: ${QWEN_API_KEY:your-api-key}
      base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${AI_MODEL:qwen-plus-2025-07-28}
        client:
          timeout: 5s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:llsp}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:your-password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  redisson:
    address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  jackson:
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:/}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
mybatis-plus:
  type-aliases-package: com.llsp.entity
logging:
  level:
    com.llsp: debug

# ========== 业务配置 ==========
llsp:
  upload:
    dir: ${UPLOAD_DIR:./uploads/imgs}
  # 阿里云 OSS（不配置则使用本地存储）
  oss:

    access-key-id: ${OSS_ACCESS_KEY_ID:your-oss-access-key}

    bucket-name: ${OSS_BUCKET_NAME:your-bucket-name}


